env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

agents:
  queue: macos-self
  os: macos

steps:
  - label: ":microscope: Verification domain"
    key: verify
    timeout_in_minutes: 15
    cancel_on_build_failing: true
    retry:
      automatic:
        - exit_status: -1
          limit: 1
        - exit_status: 255
          limit: 1
    command: |
      set -euo pipefail
      python --version
      python - <<'PY'
      import os
      commit = os.environ.get("BUILDKITE_COMMIT", "")
      pipeline = os.environ.get("BUILDKITE_PIPELINE_SLUG", "")
      assert len(commit) == 40, commit
      assert pipeline == "genius-verification", pipeline
      PY
      pip install pyyaml pytest
      python tools/validate.py .
      python -m compileall -q tools
      python -m py_compile tools/buildkite_receipt.py
      mkdir -p .verification-artifacts
      pytest -q tests/ --junitxml=.verification-artifacts/junit.xml
      sha256sum .verification-artifacts/junit.xml > .verification-artifacts/junit.xml.sha256
      python tools/buildkite_receipt.py \
        --repository Genius-Verification \
        --output .verification-artifacts/buildkite-verified-receipt.json \
        --artifact .verification-artifacts/junit.xml \
        --artifact .verification-artifacts/junit.xml.sha256
    artifact_paths:
      - ".verification-artifacts/junit.xml"
      - ".verification-artifacts/junit.xml.sha256"
      - ".verification-artifacts/buildkite-verified-receipt.json"
      - ".verification-artifacts/buildkite-verified-receipt.json.sha256"
    plugins:
      - docker#v5.14.0:
          image: "python:3.13-slim"
          always-pull: true
          pull-retries: 2
          environment:
            - "BUILDKITE_COMMIT"
            - "BUILDKITE_BRANCH"
            - "BUILDKITE_BUILD_ID"
            - "BUILDKITE_BUILD_NUMBER"
            - "BUILDKITE_PIPELINE_SLUG"
            - "BUILDKITE_ORGANIZATION_SLUG"
