    available: ["Hypothesis path"]
    missing: ["estate-wide verification tool inventory"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["tool capability and environment discovery"]
  representation:
    required: ["exact claim representation", "tool-readable input", "result projection"]
    available: ["claims/evidence schemas"]
    missing: ["cross-tool normalization"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["preserve semantics across tool/model projection"]
  verification:
    required: ["acceptance criteria", "tests", "evidence refs", "independent readback"]
    available: ["Buildkite receipts", "evidence ledger"]
    missing: ["capability-level proof graph"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["bind evidence directly to capability state"]
  observability:
    required: ["logs", "results", "exit state", "artifact hashes", "timing"]
    available: ["CI terminal receipts"]
    missing: ["cross-verifier telemetry"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["normalize verifier observations"]
  reliability_recovery:
    required: ["alternate verifier", "reproduction", "recheck", "reconciliation"]
    available: ["evidence preservation doctrine"]
    missing: ["automatic alternate-route selection"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["verification routing without global veto"]
  security_integrity:
    required: ["source identity", "artifact integrity", "tamper visibility"]
    available: ["SHA-256 receipt pattern"]
    missing: ["broader provenance binding"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["provenance graph"]
  real_world_effect:
