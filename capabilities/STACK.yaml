  knowledge:
    required: ["verification theory", "testing methods", "formal methods", "failure models"]
    available: ["domain map and source nucleus"]
    missing: ["deep method corpus"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["populate authoritative method evidence"]
  reasoning:
    required: ["claim decomposition", "counterexample search", "invariant reasoning", "uncertainty calibration"]
    available: ["model-mediated reasoning"]
    missing: ["method-routing benchmarks"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["select verification method by claim shape"]
  skills:
    required: ["test", "fuzz", "model-check", "prove", "inspect", "reproduce", "read back"]
    available: ["property-testing seed"]
    missing: ["full executable verifier inventory"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["promote proven methods into reusable capability nodes"]
  capability_composition:
    required: ["claim + verifier + evidence + readback"]
    available: ["interfaces/COMPOSITION.yaml"]
    missing: ["automatic verifier composition"]
    alternate_routes: []
    failure_modes: []
    improvement_targets: ["compose multiple independent proof surfaces without quorum paralysis"]
  tools:
