schema_version: 1
id: genius-verification.vertical-excellence
name: Genius Verification Vertical Excellence
purpose: Make verification a complete entity spanning evidence, tests, formal methods, observability, independent readback, and proof of real effects.
state: mapped

objective:
  current_reality: "Verification mastery scaffold, property-testing method seed, model-checking skeleton, evidence discipline, and Buildkite verification exist."
  desired_reality: "Any material capability claim can be mapped to the strongest applicable verification route, executed, independently read back, and preserved as evidence without confusing one failed verifier with failure of the whole mission."
  success_conditions:
    - Mission-relevant dependencies are explicit.
    - Working capability is preserved when optional routes degrade.
    - Higher-order compositions add emergent capability rather than instruction duplication.
    - Capability claims are bounded by observed evidence.

