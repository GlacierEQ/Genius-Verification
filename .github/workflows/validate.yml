name: validate-contract

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install pytest pyyaml
      - name: Compile runtime sources
        run: python -m compileall -q src tools
      - name: Validate Genius contract
        run: python tools/validate.py .
      - name: Run verification runtime suite
        run: pytest -q
